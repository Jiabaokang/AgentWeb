<!DOCTYPE html>
<html lang="zh-CN" style="width:100%;height:100%;margin:0;padding:0;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>相册选择测试</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background:#f7f7f7; }
    .container { max-width: 720px; margin: 0 auto; padding: 24px; }
    .card { background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:24px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    .btn { display:inline-block; padding:10px 16px; background:#1677ff; color:#fff; border-radius:6px; text-decoration:none; }
    .preview { margin-top:16px; display:flex; flex-wrap:wrap; gap:12px; }
    .preview img { width:120px; height:120px; object-fit:cover; border-radius:6px; border:1px solid #eee; }
    .tip { color:#666; font-size:14px; margin-top:8px; }
    input[type=file] { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h3>验证打开系统相册（accept=image/*）</h3>
      <p class="tip">点击下方按钮，期待直接进入相册；若弹出选项，应包含“相机 / 相册 / 文件”。</p>
      <label class="btn" for="albumInput">选择图片</label>
      <input id="albumInput" type="file" accept="image/*" multiple />
      <div id="preview" class="preview"></div>
      <p id="result" class="tip"></p>
    </div>
  </div>
  <script>
    const input = document.getElementById('albumInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    input.addEventListener('change', () => {
      preview.innerHTML = '';
      const files = input.files;
      result.textContent = files && files.length ? `已选择 ${files.length} 个文件` : '未选择文件';
      if (files) {
        Array.from(files).forEach(f => {
          const url = URL.createObjectURL(f);
          const img = document.createElement('img');
          img.src = url;
          preview.appendChild(img);
        });
      }
    });
  </script>
</body>
</html>
